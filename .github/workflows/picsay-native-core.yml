name: PicSay native core validation
on:
  push:
    paths:
      - "arm64-port/core/**"
      - "arm64-port/tools/**"
      - ".github/workflows/picsay-native-core.yml"
  pull_request:
    paths:
      - "arm64-port/core/**"
      - ".github/workflows/picsay-native-core.yml"
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Java and JNI signatures
        run: python3 arm64-port/tools/verify-jni-facade.py
      - name: Configure
        run: cmake -S arm64-port/core -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/host --parallel
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
  android-arm64-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ARM64 core with Android NDK
        run: |
          cmake -S arm64-port/core -B build/android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DPICSAY_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build ARM64 static engine
        run: cmake --build build/android-arm64 --parallel
      - name: Verify shared object is ELF64 AArch64
        run: |
          readelf -h build/android-arm64/libpicsay_engine.so | grep -q 'Class:.*ELF64'
          readelf -h build/android-arm64/libpicsay_engine.so | grep -q 'Machine:.*AArch64'
      - name: Package build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picsay-arm64-cpu-engine
          path: |
            build/android-arm64/libPicSayImageEngine.a
            build/android-arm64/libpicsay_engine.so

  sanitizer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: >-
          cmake -S arm64-port/core -B build/sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitized tests
        run: cmake --build build/sanitizers --parallel
      - name: Run sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/sanitizers --output-on-failure
